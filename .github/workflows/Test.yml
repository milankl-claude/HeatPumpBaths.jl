name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  consistency:
    name: JavaScript model matches Julia model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - run: julia --project=test -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=test test/consistency.jl
